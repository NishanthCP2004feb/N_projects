<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Threat Detector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #121212;
            color: #fff;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem;
            width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 {
            color: #fff;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        #login-view, #signup-view, #detection-view {
            display: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .switch-link {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #aaa;
        }

        .switch-link a {
            color: #f09433;
            cursor: pointer;
            text-decoration: underline;
        }

        .switch-link a:hover {
            color: #e6683c;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #result {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            text-align: left;
        }

        #prediction {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-transform: capitalize;
        }

        #prediction.benign { color: #28a745; }
        #prediction.phishing { color: #dc3545; }
        #prediction.malware { color: #ffc107; }
        #prediction.defacement { color: #6f42c1; }
        #prediction.malicious { color: #e83e8c; }
        #prediction.spam { color: #fd7e14; }

        #explanation {
            list-style-type: none;
            padding-left: 0;
            font-size: 0.95rem;
            color: #eee;
        }

        #explanation li {
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }

        #explanation li::before {
            content: '⚠️';
            position: absolute;
            left: 0;
        }

        #source {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 1rem;
            text-align: right;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 0.5rem;
        }

        .note {
            font-size: 0.8rem;
            color: #aaa;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div id="signup-view">
            <h2>Create New Account</h2>
            <p class="note">New users: Sign up to access the URL threat scanner.</p>
            <form id="signup-form">
                <div class="input-group">
                    <input type="text" id="signup-username" placeholder="Choose a username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-password" placeholder="Choose a password" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>
            <p id="signup-message" class="note" style="display:none"></p>
            <p class="switch-link">Already have an account? <a id="show-login">Login here</a></p>
        </div>

        <div id="login-view">
            <h2>Login</h2>
            <p class="note">Existing users: Login to access the scanner.</p>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="login-username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <p id="login-message" class="note" style="display:none"></p>
            <p class="switch-link">Don't have an account? <a id="show-signup">Sign up here</a></p>
        </div>

        <div id="detection-view">
            <h2>URL Threat Scanner</h2>
            <p class="note">Enter a URL to scan for potential threats.</p>
            <div class="input-group">
                <input type="text" id="url-input" placeholder="e.g., http://www.example.com">
            </div>
            <button id="detect-button">Scan URL</button>
            <div id="result" style="display: none;">
                <p id="prediction"></p>
                <ul id="explanation"></ul>
                <p id="source"></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const signupView = document.getElementById("signup-view");
            const loginView = document.getElementById("login-view");
            const detectionView = document.getElementById("detection-view");
            const loginForm = document.getElementById("login-form");
            const signupForm = document.getElementById("signup-form");
            const detectButton = document.getElementById("detect-button");
            const urlInput = document.getElementById("url-input");
            const resultDiv = document.getElementById("result");
            const predictionP = document.getElementById("prediction");
            const explanationUl = document.getElementById("explanation");
            const sourceP = document.getElementById("source");

            const loginUsername = document.getElementById('login-username');
            const loginPassword = document.getElementById('login-password');
            const loginMessage = document.getElementById('login-message');
            const signupUsername = document.getElementById('signup-username');
            const signupPassword = document.getElementById('signup-password');
            const signupMessage = document.getElementById('signup-message');

            // Show signup view initially
            signupView.style.display = "block";

            // Toggle between signup and login
            document.getElementById('show-login').addEventListener('click', function() {
                signupView.style.display = "none";
                loginView.style.display = "block";
            });

            document.getElementById('show-signup').addEventListener('click', function() {
                loginView.style.display = "none";
                signupView.style.display = "block";
            });

            // Signup form submission
            signupForm.addEventListener('submit', function(event) {
                event.preventDefault();
                signupMessage.style.display = 'none';
                fetch('/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: signupUsername.value, password: signupPassword.value})
                })
                .then(r => r.json().then(j => ({status: r.status, body: j})))
                .then(resp => {
                    if (resp.status === 201 && resp.body.success) {
                        signupMessage.textContent = '✓ ' + resp.body.message + ' Switching to login...';
                        signupMessage.style.display = 'block';
                        signupMessage.style.color = '#28a745';
                        signupUsername.value = '';
                        signupPassword.value = '';
                        // Auto-switch to login after 2 seconds
                        setTimeout(function() {
                            signupView.style.display = 'none';
                            loginView.style.display = 'block';
                        }, 2000);
                    } else {
                        signupMessage.textContent = '✗ ' + (resp.body.error || 'Sign up failed.');
                        signupMessage.style.display = 'block';
                        signupMessage.style.color = '#dc3545';
                    }
                })
                .catch(err => { 
                    console.error(err); 
                    signupMessage.textContent = '✗ Signup error'; 
                    signupMessage.style.display='block';
                    signupMessage.style.color = '#dc3545';
                });
            });

            // Login form submission
            loginForm.addEventListener("submit", function(event) {
                event.preventDefault();
                loginMessage.style.display = 'none';
                fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: loginUsername.value, password: loginPassword.value})
                })
                .then(r => r.json().then(j => ({status: r.status, body: j})))
                .then(resp => {
                    if (resp.status === 200 && resp.body.success) {
                        loginView.style.display = "none";
                        detectionView.style.display = "block";
                    } else {
                        loginMessage.textContent = '✗ ' + (resp.body.error || 'Login failed.');
                        loginMessage.style.display = 'block';
                        loginMessage.style.color = '#dc3545';
                    }
                })
                .catch(err => { 
                    console.error(err); 
                    loginMessage.textContent = '✗ Login error';
                    loginMessage.style.display = 'block';
                    loginMessage.style.color = '#dc3545';
                });
            });

            detectButton.addEventListener("click", function() {
                const url = urlInput.value;
                if (url) {
                    predictionP.textContent = `Scanning "${url}"...`;
                    predictionP.className = '';
                    explanationUl.innerHTML = "";
                    sourceP.textContent = "";
                    resultDiv.style.display = 'block';

                    fetch('/predict', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: url })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            predictionP.textContent = `Error: ${data.error}`;
                        } else {
                            predictionP.textContent = `Result: ${data.prediction}`;
                            predictionP.className = data.prediction.toLowerCase();
                            sourceP.textContent = `Source: ${data.source}`;

                            if (data.explanation && data.explanation.length > 0) {
                                data.explanation.forEach(reason => {
                                    const li = document.createElement("li");
                                    li.textContent = reason;
                                    explanationUl.appendChild(li);
                                });
                            }
                        }
                    })
                    .catch(error => {
                        predictionP.textContent = 'An error occurred during the scan.';
                        console.error('Error:', error);
                    });
                }
            });
        });
    </script>

</body>
</html>
